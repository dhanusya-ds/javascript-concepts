<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <link rel="stylesheet" href="example-dom.css">
</head>
<body>

    <h1 id="heading">DOM Practice</h1>

    <p class="text">Paragraph One</p>
    <p class="text">Paragraph Two</p>

    <input type="text" id="name" placeholder="Enter your name">

    <br><br>

    <button onclick="changeHeading()">Change Heading</button>

    <button onclick="changeColor()">Change Color</button>
    
    <button onclick="changeFont()">Font Size</button>
    
    <button onclick="hideHeading()">Hide Heading</button>
    
    <button onclick="showHeading()">Show Heading</button>
    
    <button onclick="showInput()">Show Input</button>
    
    <button onclick="addClass()">Add Class</button>
    
    <button onclick="removeClass()">Remove Class</button>
    
    <button onclick="toggleClass()">Toggle Class</button>
    
    <button onclick="createParagraph()">Create Paragraph</button>
    
    <button onclick="removeParagraph()">Remove First Paragraph</button>

    <script src="example-dom.js"></script>

</body>
</html>
